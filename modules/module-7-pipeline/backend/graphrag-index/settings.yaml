# GraphRAG Configuration for v3.0.x with Azure OpenAI

### LLM settings ###
completion_models:
  default_completion_model:
    type: litellm
    model_provider: azure
    model: gpt-4.1-mini
    deployment_name: gpt-4.1-mini
    api_base: https://ai-ragworkv2-vtgal6fjx3fcc.cognitiveservices.azure.com
    api_version: "2024-02-15-preview"
    api_key: 87dfca521e8c4009afbb64466c735076
    rate_limit:
      requests_per_period: 200
      period: 60
    retry:
      type: exponential_backoff
      max_retries: 10

embedding_models:
  default_embedding_model:
    type: litellm
    model_provider: azure
    model: text-embedding-3-large
    deployment_name: text-embedding-3-large
    api_base: https://ai-ragworkv2-vtgal6fjx3fcc.cognitiveservices.azure.com
    api_version: "2024-02-15-preview"
    api_key: 87dfca521e8c4009afbb64466c735076
    rate_limit:
      requests_per_period: 200
      period: 60
    retry:
      type: exponential_backoff
      max_retries: 10

### Document processing settings ###
input:
  type: text

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: cl100k_base

### Storage settings ###
input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"
    
vector_store:
  type: lancedb
  db_uri: output/lancedb

### Workflow settings ###
embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  entity_types:
    - STATION
    - LOCATION
    - LINE
    - SERVICE
    - INFRASTRUCTURE
    - ORGANIZATION
    - PERSON
    - DATE
    - METRIC
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  max_length: 500

cluster_graph:
  max_cluster_size: 10

community_reports:
  completion_model_id: default_completion_model
  max_length: 2000
  max_input_length: 8000

### Query settings ###
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  max_context_tokens: 16000
  llm_max_tokens: 4000
  top_k_entities: 25
  top_k_relationships: 25
  text_unit_prop: 0.65
  community_prop: 0.2
  conversation_history_max_turns: 5

global_search:
  completion_model_id: default_completion_model
  max_tokens: 12000
  data_max_tokens: 8000
  map_max_tokens: 1000
  reduce_max_tokens: 2000
  concurrency: 16

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  data_max_tokens: 16000
  # Performance vs Quality tuning (defaults: n_depth=3, drift_k_followups=20, primer_folds=5)
  # Balanced settings: enough depth for multi-hop reasoning without excessive LLM calls
  n_depth: 2                           # 2 iterations for multi-hop entity resolution
  drift_k_followups: 10                # 10 follow-ups for broader community coverage
  primer_folds: 3                      # 3 primer folds for better context priming
  local_search_top_k_mapped_entities: 25   # Match local_search top_k
  local_search_top_k_relationships: 25     # Match local_search top_k

snapshots:
  graphml: true
